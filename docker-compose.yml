version: '3.8'
services:
  nestjs-starter-code-db:
    image: postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5434:5432'
    volumes: 
      - nestjs-starter-code:/var/lib/postgresql/data

volumes:
  nestjs-starter-code:
